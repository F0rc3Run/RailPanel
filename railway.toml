[build]
builder = "dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 45
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

# numReplicas is deliberately absent. Setting it here locks the Scale section
# in Railway's dashboard, and replicas cannot work for this service anyway:
# each one would run its own Xray against the same volume, and Railway itself
# refuses replicas once a volume is attached.
